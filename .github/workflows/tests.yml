name: tests

on:
  push:
    branches: [main, agent/education-edition]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Compile Python sources
        run: python -m py_compile app.py pages/*.py model_builder/*.py
      - name: Run tests
        run: pytest -q
